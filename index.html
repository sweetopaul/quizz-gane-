
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweeto Quiz</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #fce7f3);
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px #0002;
}

h1, h2, h3 {
    text-align: center;
    color: #6d28d9;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #aaa;
    border-radius: 7px;
    font-size: 16px;
}

button {
    padding: 12px;
    margin: 5px 0;
    border: none;
    border-radius: 7px;
    background: #7c3aed;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #5b21b6;
}

.main-button {
    width: 100%;
    margin-top: 12px;
}

.secondary {
    background: #475569;
}

.danger {
    background: #dc2626;
}

.option {
    display: block;
    width: 100%;
    text-align: left;
    margin: 10px 0;
    padding: 14px;
    background: #f3e8ff;
    color: #222;
    border: 2px solid transparent;
}

.option:disabled {
    cursor: default;
    opacity: 1;
}

.correct {
    background: #bbf7d0 !important;
    border-color: #16a34a !important;
    color: #14532d !important;
}

.wrong {
    background: #fecaca !important;
    border-color: #dc2626 !important;
    color: #7f1d1d !important;
}

.hidden {
    display: none;
}

.progress {
    height: 10px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
    margin: 15px 0;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #8b5cf6;
}

.feedback {
    padding: 12px;
    border-radius: 7px;
    margin-top: 15px;
    font-weight: bold;
}

.good {
    background: #dcfce7;
    color: #166534;
}

.bad {
    background: #fee2e2;
    color: #991b1b;
}

.score {
    font-size: 42px;
    font-weight: bold;
    color: #7c3aed;
    text-align: center;
    margin: 20px;
}

.history-item, .review-item {
    padding: 15px;
    margin: 12px 0;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
}

.gold {
    border-left: 5px solid #eab308;
}

.silver {
    border-left: 5px solid #94a3b8;
}

.bronze {
    border-left: 5px solid #b45309;
}

.small-text {
    font-size: 13px;
    color: #64748b;
}
</style>
</head>

<body>

<div class="container">

<!-- HOME PAGE -->
<section id="homePage">
    <h1>💜 Sweeto Quiz 💜</h1>

    <p style="text-align:center">
        How well do you know Sweeto?
    </p>

    <input type="text" id="playerName"
           placeholder="Enter your name">

    <button class="main-button" onclick="startQuiz()">
        Start Quiz
    </button>

    <button class="main-button secondary"
            onclick="showHistory()">
        Players & Rankings
    </button>

    <p class="small-text">
        10 questions. Each correct answer gives 1 point.
    </p>
</section>


<!-- QUIZ PAGE -->
<section id="quizPage" class="hidden">

    <h2>Sweeto Quiz</h2>

    <p id="welcomeText"></p>
    <p id="questionNumber"></p>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <h3 id="questionText"></h3>

    <div id="optionsContainer"></div>

    <div id="feedback" class="feedback hidden"></div>

    <button id="nextButton" class="main-button hidden"
            onclick="nextQuestion()">
        Next Question
    </button>
</section>


<!-- RESULT PAGE -->
<section id="resultPage" class="hidden">

    <h1>🎉 Quiz Completed!</h1>

    <p id="resultName" style="text-align:center"></p>

    <div class="score" id="finalScore"></div>

    <h3 id="resultMessage"></h3>

    <button class="main-button" onclick="viewMyAnswers()">
        Review My Answers
    </button>

    <button class="main-button" onclick="restartQuiz()">
        Play Again
    </button>

    <button class="main-button secondary" onclick="showHistory()">
        View Rankings
    </button>

    <button class="main-button secondary" onclick="goHome()">
        Home
    </button>
</section>


<!-- ANSWER REVIEW PAGE -->
<section id="reviewPage" class="hidden">

    <h1>Answer Review</h1>
    <p id="reviewHeading"></p>

    <div id="reviewContainer"></div>

    <button class="main-button" onclick="restartQuiz()">
        Play Again
    </button>

    <button class="main-button secondary" onclick="showHistory()">
        View Rankings
    </button>

    <button class="main-button secondary" onclick="goHome()">
        Home
    </button>
</section>


<!-- HISTORY PAGE -->
<section id="historyPage" class="hidden">

    <h1>🏆 Players & Rankings</h1>

    <div id="historyContainer"></div>

    <button class="main-button secondary" onclick="goHome()">
        Home
    </button>

    <button class="main-button danger" onclick="clearHistory()">
        Clear All History
    </button>
</section>

</div>


<script>

// QUESTIONS
const questions = [
    {
        question: "1. What is Sweeto's biggest wish in 2027?",
        options: [
            "Dhoni winning IPL 2027",
            "Buying a new Car",
            "Buying a new phone",
            "Kerala Blasters winning ISL 2026-2027"
        ],
        answer: "Kerala Blasters winning ISL 2026-2027"
    },
    {
        question: "2. What is Sweeto scared of?",
        options: ["Attachments", "Work", "Gossips", "Losing"],
        answer: "Attachments"
    },
    {
        question: "3. What makes Sweeto happy?",
        options: [
            "Call from his sister",
            "Playing football",
            "Spending time with friends",
            "Watching football and cricket"
        ],
        answer: "Call from his sister"
    },
    {
        question: "4. What does Sweeto call his sister?",
        options: ["Heart", "Jaan", "Varzhaa", "Doll"],
        answer: "Heart"
    },
    {
        question: "5. Who is Sweeto's favourite Bollywood actor?",
        options: [
            "Aamir Khan",
            "Shah Rukh Khan",
            "Salman Khan",
            "Sushant Singh Rajput"
        ],
        answer: "Aamir Khan"
    },
    {
        question: "6. Who is Sweeto's favourite Malayalam actor?",
        options: ["Dileep", "Mohanlal", "Mammootty", "Prithviraj"],
        answer: "Dileep"
    },
    {
        question: "7. What makes Sweeto upset?",
        options: [
            "When Kerala loses",
            "Dhoni gets out for a duck",
            "When his sister doesn't call him",
            "When his team loses"
        ],
        answer: "When his sister doesn't call him"
    },
    {
        question: "8. Who is Sweeto's favourite cricketer?",
        options: ["Kohli", "Sanju", "Dhoni", "Sachin"],
        answer: "Dhoni"
    },
    {
        // Example question: change it if needed.
        question: "9. Which sport does Sweeto enjoy?",
        options: ["Football", "Basketball", "Tennis", "Badminton"],
        answer: "Football"
    },
    {
        // Example question: change it if needed.
        question: "10. Which IPL team does Sweeto support?",
        options: ["CSK", "MI", "RCB", "KKR"],
        answer: "CSK"
    }
];


// VARIABLES
let currentQuestion = 0;
let score = 0;
let player = "";
let playerAnswers = [];
let answerSelected = false;
let currentAttemptId = null;

const HISTORY_KEY = "sweetoQuizHistory";


// GET SAVED HISTORY
function getHistory() {
    try {
        const history = JSON.parse(
            localStorage.getItem(HISTORY_KEY)
        );

        return Array.isArray(history) ? history : [];
    } catch (error) {
        return [];
    }
}


// SAVE HISTORY
function saveHistory(history) {
    try {
        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(history)
        );
    } catch (error) {
        alert("Unable to save history in this browser.");
    }
}


// SHOW ONE PAGE
function showPage(pageId) {
    const pages = [
        "homePage",
        "quizPage",
        "resultPage",
        "reviewPage",
        "historyPage"
    ];

    pages.forEach(function(page) {
        document.getElementById(page).classList.add("hidden");
    });

    document.getElementById(pageId).classList.remove("hidden");
}


// START QUIZ
function startQuiz() {
    const nameInput = document.getElementById("playerName");

    player = nameInput.value.trim();

    if (player === "") {
        alert("Please enter your name first!");
        nameInput.focus();
        return;
    }

    currentQuestion = 0;
    score = 0;
    playerAnswers = [];
    currentAttemptId = null;

    document.getElementById("welcomeText").textContent =
        "Good luck, " + player + "!";

    showPage("quizPage");
    showQuestion();
}


// DISPLAY QUESTION
function showQuestion() {
    answerSelected = false;

    const question = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) +
        " of " + questions.length;

    document.getElementById("questionText").textContent =
        question.question;

    document.getElementById("progressBar").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback hidden";
    feedback.textContent = "";

    const nextButton = document.getElementById("nextButton");
    nextButton.classList.add("hidden");

    const optionsContainer =
        document.getElementById("optionsContainer");

    optionsContainer.innerHTML = "";

    question.options.forEach(function(option) {
        const button = document.createElement("button");

        button.textContent = option;
        button.className = "option";

        button.addEventListener("click", function() {
            checkAnswer(option, button);
        });

        optionsContainer.appendChild(button);
    });
}


// CHECK ANSWER
function checkAnswer(selectedAnswer, selectedButton) {
    if (answerSelected) {
        return;
    }

    answerSelected = true;

    const question = questions[currentQuestion];
    const isCorrect = selectedAnswer === question.answer;

    if (isCorrect) {
        score++;
    }

    playerAnswers.push({
        question: question.question,
        selected: selectedAnswer,
        correct: question.answer,
        isCorrect: isCorrect
    });

    const buttons = document.querySelectorAll(".option");

    buttons.forEach(function(button) {
        button.disabled = true;

        if (button.textContent === question.answer) {
            button.classList.add("correct");
        }
    });

    if (!isCorrect) {
        selectedButton.classList.add("wrong");
    }

    const feedback = document.getElementById("feedback");
    feedback.classList.remove("hidden");

    if (isCorrect) {
        feedback.textContent = "Correct answer! 🎉";
        feedback.classList.add("good");
    } else {
        feedback.textContent =
            "Wrong answer! Correct answer: " + question.answer;

        feedback.classList.add("bad");
    }

    const nextButton = document.getElementById("nextButton");

    nextButton.textContent =
        currentQuestion === questions.length - 1
        ? "See My Score"
        : "Next Question";

    nextButton.classList.remove("hidden");
}


// NEXT QUESTION
function nextQuestion() {
    if (!answerSelected) {
        return;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        finishQuiz();
    }
}


// FINISH QUIZ
function finishQuiz() {
    const history = getHistory();

    const attempt = {
        id: Date.now() + "-" + Math.random(),
        name: player,
        score: score,
        total: questions.length,
        answers: playerAnswers,
        date: new Date().toLocaleString()
    };

    currentAttemptId = attempt.id;

    history.push(attempt);
    saveHistory(history);

    document.getElementById("resultName").textContent =
        "Well done, " + player + "!";

    document.getElementById("finalScore").textContent =
        score + " / " + questions.length;

    let message = "";

    if (score === questions.length) {
        message = "Perfect score! 🏆";
    } else if (score >= 7) {
        message = "Excellent job! 🌟";
    } else if (score >= 4) {
        message = "Good try! 😊";
    } else {
        message = "Keep practising! 💜";
    }

    document.getElementById("resultMessage").textContent = message;

    showPage("resultPage");
}


// SAFE HTML TEXT
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        const characters = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        };

        return characters[char];
    });
}


// CREATE ANSWER REVIEW
function createAnswerReview(attempt) {
    const container = document.getElementById("reviewContainer");

    container.innerHTML = "";

    if (!Array.isArray(attempt.answers)) {
        container.textContent = "No answer details are available.";
        return;
    }

    attempt.answers.forEach(function(answer, index) {
        const item = document.createElement("div");
        item.className = "review-item";

        const status = answer.isCorrect
            ? "✅ Correct"
            : "❌ Incorrect";

        item.innerHTML = `
            <strong>${index + 1}. ${escapeHTML(answer.question)}</strong>
            <p>Your answer: ${escapeHTML(answer.selected)}</p>
            <p>Correct answer: ${escapeHTML(answer.correct)}</p>
            <p>${status}</p>
        `;

        container.appendChild(item);
    });
}


// REVIEW MY ANSWERS
function viewMyAnswers() {
    const history = getHistory();

    const attempt = history.find(function(item) {
        return item.id === currentAttemptId;
    });

    if (!attempt) {
        alert("Your quiz result was not found.");
        return;
    }

    document.getElementById("reviewHeading").textContent =
        player + " — Score: " + score + " / " + questions.length;

    createAnswerReview(attempt);
    showPage("reviewPage");
}


// SHOW PLAYERS AND RANKINGS
function showHistory() {
    const history = getHistory();

    const container = document.getElementById("historyContainer");
    container.innerHTML = "";

    if (history.length === 0) {
        container.textContent = "No players have completed the quiz yet.";
        showPage("historyPage");
        return;
    }

    history.sort(function(a, b) {
        return b.score - a.score;
    });

    let previousScore = null;
    let rank = 0;

    history.forEach(function(attempt, index) {
        if (attempt.score !== previousScore) {
            rank = index + 1;
        }

        previousScore = attempt.score;

        let medal = "";
        let rankClass = "";

        if (rank === 1) {
            medal = "🥇";
            rankClass = "gold";
        } else if (rank === 2) {
            medal = "🥈";
            rankClass = "silver";
        } else if (rank === 3) {
            medal = "🥉";
            rankClass = "bronze";
        }

        const item = document.createElement("div");
        item.className = "history-item " + rankClass;

        const heading = document.createElement("h3");
        heading.textContent = medal + " Rank " + rank + ": " + attempt.name;

        const scoreText = document.createElement("p");
        scoreText.textContent =
            "Score: " + attempt.score + " / " + attempt.total;

        const dateText = document.createElement("p");
        dateText.className = "small-text";
        dateText.textContent = attempt.date || "";

        const reviewButton = document.createElement("button");
        reviewButton.textContent = "Review Answers";
        reviewButton.addEventListener("click", function() {
            reviewPlayer(attempt.id);
        });

        item.appendChild(heading);
        item.appendChild(scoreText);
        item.appendChild(dateText);
        item.appendChild(reviewButton);

        container.appendChild(item);
    });

    showPage("historyPage");
}


// REVIEW A PLAYER'S ANSWERS
function reviewPlayer(id) {
    const history = getHistory();

    const attempt = history.find(function(item) {
        return item.id === id;
    });

    if (!attempt) {
        alert("Player result not found.");
        return;
    }

    document.getElementById("reviewHeading").textContent =
        attempt.name + " — Score: " +
        attempt.score + " / " + attempt.total;

    createAnswerReview(attempt);
    showPage("reviewPage");
}


// CLEAR HISTORY
function clearHistory() {
    const confirmed = confirm(
        "Are you sure you want to delete all saved quiz history?"
    );

    if (!confirmed) {
        return;
    }

    localStorage.removeItem(HISTORY_KEY);

    currentAttemptId = null;

    showHistory();
}


// RETURN HOME
function goHome() {
    showPage("homePage");
}


// RESTART QUIZ
function restartQuiz() {
    document.getElementById("playerName").value = player;
    startQuiz();
}

</script>

</body>
</html>
