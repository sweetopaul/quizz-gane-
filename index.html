
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweeto Quiz</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #fce7f3);
    margin: 0;
    padding: 20px;
    color: #333;
}

.container {
    max-width: 700px;
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #00000018;
}

h1, h2 {
    color: #6d28d9;
    text-align: center;
}

input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin: 10px 0;
    font-size: 16px;
}

button {
    background: #7c3aed;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
    font-size: 15px;
}

button:hover {
    background: #5b21b6;
}

.option {
    display: block;
    padding: 12px;
    margin: 8px 0;
    background: #f3e8ff;
    border-radius: 8px;
    cursor: pointer;
}

.option input {
    margin-right: 8px;
}

.hidden {
    display: none !important;
}

.center {
    text-align: center;
}

.question {
    font-size: 18px;
    font-weight: bold;
    margin: 20px 0;
}

.progress {
    color: #6d28d9;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
    overflow-wrap: anywhere;
}

th {
    background: #ede9fe;
    color: #4c1d95;
}

.correct {
    color: #15803d;
}

.wrong {
    color: #dc2626;
}

.message {
    text-align: center;
    margin: 12px 0;
    overflow-wrap: anywhere;
}

@media (max-width: 500px) {
    .container {
        padding: 15px;
    }

    button {
        max-width: 100%;
    }

    th, td {
        padding: 6px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container" id="homePage">
    <h1>💜 Sweeto Quiz 💜</h1>
    <p class="center">Welcome! Enter your name and test your knowledge.</p>

    <label for="playerName">Enter your name:</label>
    <input type="text" id="playerName" placeholder="Your name">

    <div class="center">
        <button onclick="startQuiz()">Start Quiz</button>
        <button onclick="askForRankings()">Players &amp; Rankings</button>
    </div>

    <p id="homeMessage" class="message"></p>
</div>

<div class="container hidden" id="quizPage">
    <h2>Sweeto Quiz</h2>
    <p id="welcomeText" class="center"></p>
    <p id="progress" class="progress"></p>

    <div id="questionText" class="question"></div>
    <div id="options"></div>

    <div class="center">
        <button id="nextButton" onclick="nextQuestion()">Next Question</button>
    </div>

    <p id="quizMessage" class="message"></p>
</div>

<div class="container hidden" id="resultPage">
    <h1>🎉 Quiz Completed!</h1>
    <h2 id="finalScore"></h2>
    <p id="saveMessage" class="message"></p>

    <div class="center">
        <button onclick="showReview()">Review Answers</button>
        <button onclick="goHome()">Home</button>
        <button onclick="askForRankings()">Players &amp; Rankings</button>
    </div>
</div>

<div class="container hidden" id="reviewPage">
    <h2>Answer Review</h2>
    <div id="reviewContent"></div>

    <div class="center">
        <button onclick="showPage('resultPage')">Back to Result</button>
        <button onclick="goHome()">Home</button>
    </div>
</div>

<div class="container hidden" id="historyPage">
    <h2>🏆 Players &amp; Rankings</h2>
    <p class="center">Leaderboard of saved quiz attempts</p>

    <div class="center">
        <button onclick="loadRankings()">Refresh Rankings</button>
        <button onclick="lockRankings()">Lock Rankings</button>
        <button onclick="goHome()">Home</button>
    </div>

    <p id="rankingMessage" class="message"></p>

    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Score</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="rankingBody"></tbody>
        </table>
    </div>
</div>

<!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ------------------------------------
// 1. SUPABASE CONNECTION
// ------------------------------------

const SUPABASE_URL = "https://ragtoiqucgtticvudxwx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cGsjpgwYU3lL5UsAoxWcwA_EwAG9_vp";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ------------------------------------
// 2. RANKINGS PASSWORD
// ------------------------------------

const RANKINGS_PASSWORD = "leona";
let rankingsUnlocked = false;

// ------------------------------------
// 3. QUIZ QUESTIONS
// ------------------------------------

const questions = [
    {
        question: "What does HTML stand for?",
        options: [
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyper Tool Markup Language",
            "Home Text Markup Language"
        ],
        answer: 0
    },
    {
        question: "Which language is used to style a webpage?",
        options: ["HTML", "CSS", "SQL", "Python"],
        answer: 1
    },
    {
        question: "Which language makes webpages interactive?",
        options: ["CSS", "HTML", "JavaScript", "XML"],
        answer: 2
    },
    {
        question: "Which HTML tag creates a paragraph?",
        options: ["<h1>", "<p>", "<div>", "<img>"],
        answer: 1
    },
    {
        question: "Which symbol starts an ID selector in CSS?",
        options: [".", "#", "*", "&"],
        answer: 1
    },
    {
        question: "Which keyword declares a variable in JavaScript?",
        options: ["var", "let", "const", "All of these"],
        answer: 3
    },
    {
        question: "Which method selects an element by its ID?",
        options: [
            "getElementById()",
            "getElementByName()",
            "selectId()",
            "findElement()"
        ],
        answer: 0
    },
    {
        question: "Which event happens when a button is clicked?",
        options: ["onchange", "onload", "onclick", "onclose"],
        answer: 2
    },
    {
        question: "Which property gets the value typed into an input?",
        options: ["innerHTML", "value", "style", "text"],
        answer: 1
    },
    {
        question: "Which method adds an element inside another element?",
        options: [
            "appendChild()",
            "remove()",
            "alert()",
            "prompt()"
        ],
        answer: 0
    }
];

// ------------------------------------
// 4. QUIZ VARIABLES
// ------------------------------------

let playerName = "";
let currentQuestion = 0;
let score = 0;
let playerAnswers = [];
let savingScore = false;

// ------------------------------------
// 5. PAGE NAVIGATION
// ------------------------------------

function showPage(pageId) {
    if (pageId === "historyPage" && !rankingsUnlocked) {
        alert("Enter the password to view rankings.");
        return;
    }

    const pages = [
        "homePage",
        "quizPage",
        "resultPage",
        "reviewPage",
        "historyPage"
    ];

    pages.forEach(function(id) {
        document.getElementById(id).classList.add("hidden");
    });

    document.getElementById(pageId).classList.remove("hidden");
}

function goHome() {
    showPage("homePage");
}

// ------------------------------------
// 6. START QUIZ
// ------------------------------------

function startQuiz() {
    playerName = document.getElementById("playerName")
        .value.trim();

    if (playerName === "") {
        document.getElementById("homeMessage").innerText =
            "Please enter your name first.";
        return;
    }

    currentQuestion = 0;
    score = 0;
    playerAnswers = [];

    document.getElementById("welcomeText").innerText =
        "Good luck, " + playerName + "!";

    document.getElementById("homeMessage").innerText = "";

    showPage("quizPage");
    displayQuestion();
}

// ------------------------------------
// 7. DISPLAY QUESTION
// ------------------------------------

function displayQuestion() {
    const q = questions[currentQuestion];

    document.getElementById("progress").innerText =
        "Question " + (currentQuestion + 1) +
        " of " + questions.length;

    document.getElementById("questionText").innerText =
        q.question;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach(function(option, index) {
        const label = document.createElement("label");
        label.className = "option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "answer";
        radio.value = index;

        label.appendChild(radio);
        label.appendChild(document.createTextNode(option));

        optionsDiv.appendChild(label);
    });

    document.getElementById("quizMessage").innerText = "";

    document.getElementById("nextButton").innerText =
        currentQuestion === questions.length - 1
            ? "Finish Quiz"
            : "Next Question";
}

// ------------------------------------
// 8. NEXT QUESTION AND SCORING
// ------------------------------------

function nextQuestion() {
    const selected = document.querySelector(
        'input[name="answer"]:checked'
    );

    if (!selected) {
        document.getElementById("quizMessage").innerText =
            "Please select an answer.";
        return;
    }

    const selectedAnswer = Number(selected.value);
    const correctAnswer = questions[currentQuestion].answer;

    playerAnswers.push(selectedAnswer);

    if (selectedAnswer === correctAnswer) {
        score++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        displayQuestion();
    } else {
        finishQuiz();
    }
}

// ------------------------------------
// 9. SAVE SCORE TO SUPABASE
// ------------------------------------

async function finishQuiz() {
    showPage("resultPage");

    document.getElementById("finalScore").innerText =
        playerName + ", your score is " +
        score + " / " + questions.length;

    const saveMessage = document.getElementById("saveMessage");
    saveMessage.innerText = "Saving your score online...";

    if (savingScore) {
        return;
    }

    savingScore = true;

    try {
        const { data, error } = await db
            .from("quiz_scores")
            .insert([{
                player_name: playerName,
                score: score,
                total: questions.length,
                answers: playerAnswers
            }])
            .select();

        if (error) {
            throw error;
        }

        saveMessage.innerText =
            "Your score was saved successfully!";

    } catch (error) {
        console.error("Score saving error:", error);

        saveMessage.innerText =
            "Score could not be saved online. Check your Supabase table and permissions.";
    } finally {
        savingScore = false;
    }
}

// ------------------------------------
// 10. REVIEW ANSWERS
// ------------------------------------

function showReview() {
    const reviewContent = document.getElementById("reviewContent");
    reviewContent.innerHTML = "";

    questions.forEach(function(q, index) {
        const block = document.createElement("div");
        block.style.padding = "12px";
        block.style.marginBottom = "12px";
        block.style.background = "#f9fafb";
        block.style.borderRadius = "8px";

        const questionTitle = document.createElement("p");
        questionTitle.innerText =
            (index + 1) + ". " + q.question;

        const yourAnswer = document.createElement("p");

        const chosenIndex = playerAnswers[index];

        yourAnswer.innerText =
            "Your answer: " +
            (chosenIndex === undefined
                ? "Not answered"
                : q.options[chosenIndex]);

        yourAnswer.className =
            chosenIndex === q.answer ? "correct" : "wrong";

        const correctAnswer = document.createElement("p");
        correctAnswer.innerText =
            "Correct answer: " + q.options[q.answer];
        correctAnswer.className = "correct";

        block.appendChild(questionTitle);
        block.appendChild(yourAnswer);
        block.appendChild(correctAnswer);

        reviewContent.appendChild(block);
    });

    showPage("reviewPage");
}

// ------------------------------------
// 11. ASK FOR RANKINGS PASSWORD
// ------------------------------------

function askForRankings() {
    const password = prompt(
        "Enter password to view Players & Rankings:"
    );

    if (password === null) {
        return;
    }

    if (password.trim() === RANKINGS_PASSWORD) {
        rankingsUnlocked = true;
        showPage("historyPage");
        loadRankings();
    } else {
        rankingsUnlocked = false;

        document.getElementById("historyPage")
            .classList.add("hidden");

        alert("Incorrect password! Please try again.");
    }
}

// ------------------------------------
// 12. LOCK RANKINGS
// ------------------------------------

function lockRankings() {
    rankingsUnlocked = false;
    document.getElementById("historyPage")
        .classList.add("hidden");

    showPage("homePage");
}

// ------------------------------------
// 13. LOAD ONLINE RANKINGS
// ------------------------------------

async function loadRankings() {
    if (!rankingsUnlocked) {
        return;
    }

    const rankingMessage =
        document.getElementById("rankingMessage");

    const rankingBody =
        document.getElementById("rankingBody");

    rankingBody.innerHTML = "";
    rankingMessage.innerText = "Loading rankings...";

    try {
        const { data, error } = await db
            .from("quiz_scores")
            .select("player_name, score, total, created_at")
            .order("score", { ascending: false })
            .order("created_at", { ascending: true });

        if (error) {
            throw error;
        }

        if (!rankingsUnlocked) {
            return;
        }

        rankingBody.innerHTML = "";

        if (!data || data.length === 0) {
            rankingMessage.innerText =
                "No scores have been saved yet.";
            return;
        }

        data.forEach(function(player, index) {
            const row = document.createElement("tr");

            const rankCell = document.createElement("td");
            rankCell.innerText = index + 1;

            const nameCell = document.createElement("td");
            nameCell.innerText = player.player_name;

            const scoreCell = document.createElement("td");
            scoreCell.innerText = player.score;

            const totalCell = document.createElement("td");
            totalCell.innerText = player.total;

            row.appendChild(rankCell);
            row.appendChild(nameCell);
            row.appendChild(scoreCell);
            row.appendChild(totalCell);

            rankingBody.appendChild(row);
        });

        rankingMessage.innerText =
            "Rankings updated. Total quiz attempts: " + data.length;

    } catch (error) {
        console.error("Rankings error:", error);

        rankingMessage.innerText =
            "Could not load rankings. Check your Supabase table and SELECT permissions.";
    }
}
</script>

</body>
</html>
